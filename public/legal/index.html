<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>万业互联云 · 平台协议</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif; margin: 0; padding: 32px 20px; background: #f5f6f8; color: #1f2329; }
    .box { max-width: 720px; margin: 0 auto; background: #fff; border-radius: 12px; padding: 28px 24px; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
    h1 { font-size: 22px; margin: 0 0 8px; }
    p { color: #646a73; font-size: 14px; line-height: 1.6; margin: 0 0 20px; }
    a { display: block; padding: 14px 0; border-top: 1px solid #eef0f3; color: #ff4d4f; text-decoration: none; font-size: 16px; }
    a:first-of-type { border-top: none; }
    .meta { font-size: 12px; color: #8f959e; margin-top: 4px; }
    footer { margin-top: 24px; font-size: 12px; color: #8f959e; }
  </style>
</head>
<body>
  <div class="box">
    <h1>万业互联云平台协议</h1>
    <p>以下协议置于平台显著位置，内容与线上一致。申请主体：请以协议落款全称为准。</p>
    <a href="./user-service-agreement.pdf" target="_blank">
      《用户服务协议》（万业互联云平台用户服务协议）
      <div class="meta">路径：/legal/user-service-agreement.pdf</div>
    </a>
    <a href="./merchant-onboarding-agreement.pdf" target="_blank">
      《商户入驻平台协议》（万业互联云商户入驻服务协议）
      <div class="meta">路径：/legal/merchant-onboarding-agreement.pdf</div>
    </a>
    <a href="./transaction-dispute-resolution.pdf" target="_blank">
      《消费者权益保障措施说明》（万业互联云平台交易纠纷处理机制说明）
      <div class="meta">路径：/legal/transaction-dispute-resolution.pdf</div>
    </a>
    <footer>小程序内查看：登录页协议勾选 · 我的 → 平台协议 · 入驻申请页协议链接</footer>
  </div>
</body>
</html>
