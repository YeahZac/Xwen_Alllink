<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>万业互联云 · 夜市指挥大屏</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700;800&family=Noto+Sans+SC:wght@400;500;700&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="./screen.css" />
</head>
<body>
  <div class="fx-lanterns" aria-hidden="true"></div>
  <div class="fx-grain" aria-hidden="true"></div>

  <div class="screen">
    <header class="screen-head">
      <div class="head-left">
        <div class="seal" aria-hidden="true">万</div>
        <div>
          <p class="brand">万业互联云 · 夜市指挥</p>
          <p class="brand-sub">供货 · 地摊 · 积分 · 异业</p>
        </div>
      </div>
      <nav class="page-tabs" id="pageTabs" role="tablist">
        <button type="button" class="tab on" data-page="ops" role="tab" aria-selected="true">夜市指挥</button>
        <button type="button" class="tab" data-page="flow" role="tab" aria-selected="false">货脉流向</button>
        <button type="button" class="tab" data-page="points" role="tab" aria-selected="false">积分异业</button>
      </nav>
      <div class="head-right">
        <div class="live-pill"><span class="pulse"></span> 夜市在线</div>
        <span id="clock"></span>
        <a class="back" href="./">返回运营台</a>
      </div>
    </header>

    <div class="ticker" aria-label="实时成交">
      <span class="ticker-tag">实时</span>
      <div class="ticker-mask"><div class="ticker-track" id="ticker"></div></div>
    </div>

    <!-- 1 夜市指挥 -->
    <section class="board on" id="board-ops" data-page="ops">
      <div class="kpi-row" id="kpisOps"></div>
      <div class="main-grid">
        <aside class="col left">
          <div class="panel">
            <div class="panel-hd"><span class="ico lantern"></span><h3>24 小时夜市脉搏</h3></div>
            <canvas id="hourlyOps" height="168"></canvas>
          </div>
          <div class="panel">
            <div class="panel-hd"><span class="ico coin"></span><h3>交易结构</h3></div>
            <div id="gmvMix" class="gmv-mix"></div>
          </div>
          <div class="panel">
            <div class="panel-hd"><span class="ico people"></span><h3>角色构成</h3></div>
            <div id="roleMix" class="bars"></div>
          </div>
        </aside>
        <section class="col center">
          <div class="panel map-panel">
            <div class="panel-hd">
              <span class="ico pin"></span>
              <h3>夜市点位 · 赣北走廊</h3>
              <div class="map-filters" id="mapFiltersOps">
                <button type="button" class="chip on" data-role="all">全部</button>
                <button type="button" class="chip stall" data-role="stall">地摊</button>
                <button type="button" class="chip cross" data-role="cross">异业</button>
                <button type="button" class="chip supply" data-role="supply">仓网</button>
              </div>
            </div>
            <div id="mapOps" class="leaflet-host"></div>
            <div class="map-stat" id="mapStatOps"></div>
          </div>
        </section>
        <aside class="col right">
          <div class="panel">
            <div class="panel-hd"><span class="ico city"></span><h3>热门城市</h3></div>
            <div id="cities" class="bars"></div>
          </div>
          <div class="panel grow">
            <div class="panel-hd"><span class="ico bag"></span><h3>热销档口</h3></div>
            <div id="goodsOps" class="rank-list"></div>
          </div>
        </aside>
      </div>
    </section>

    <!-- 2 货脉流向 -->
    <section class="board" id="board-flow" data-page="flow">
      <div class="kpi-row" id="kpisFlow"></div>
      <div class="main-grid">
        <aside class="col left">
          <div class="panel grow">
            <div class="panel-hd"><span class="ico truck"></span><h3>仓 → 摊 货脉</h3></div>
            <div id="cargoList" class="route-list"></div>
          </div>
          <div class="panel">
            <div class="panel-hd"><span class="ico split"></span><h3>履约方式</h3></div>
            <div id="fulfill" class="gmv-mix"></div>
          </div>
        </aside>
        <section class="col center">
          <div class="panel map-panel">
            <div class="panel-hd">
              <span class="ico pin"></span>
              <h3>灯笼线 · 供货弧</h3>
              <p class="hint">仓网出发，落在夜市档口</p>
            </div>
            <div id="mapFlow" class="leaflet-host"></div>
            <div class="map-stat" id="mapStatFlow"></div>
          </div>
        </section>
        <aside class="col right">
          <div class="panel">
            <div class="panel-hd"><span class="ico warehouse"></span><h3>仓网点</h3></div>
            <div id="warehouses" class="hot-stores"></div>
          </div>
          <div class="panel grow">
            <div class="panel-hd"><span class="ico bag"></span><h3>进货热 SKU</h3></div>
            <div id="goodsFlow" class="rank-list"></div>
          </div>
        </aside>
      </div>
    </section>

    <!-- 3 积分异业 -->
    <section class="board" id="board-points" data-page="points">
      <div class="kpi-row" id="kpisPoints"></div>
      <div class="main-grid">
        <aside class="col left">
          <div class="panel">
            <div class="panel-hd"><span class="ico coin"></span><h3>积分健康</h3></div>
            <div id="pointsHealth" class="gmv-mix"></div>
            <p class="foot-note" id="pointsNote"></p>
          </div>
          <div class="panel">
            <div class="panel-hd"><span class="ico lantern"></span><h3>兑换时段</h3></div>
            <canvas id="hourlyPoints" height="168"></canvas>
          </div>
          <div class="panel">
            <div class="panel-hd"><span class="ico warn"></span><h3>池子纪律</h3></div>
            <ul class="discipline" id="discipline"></ul>
          </div>
        </aside>
        <section class="col center">
          <div class="panel map-panel">
            <div class="panel-hd">
              <span class="ico pin"></span>
              <h3>积分去向 · 异业核销热力</h3>
              <p class="hint">摊位发分，门店收分</p>
            </div>
            <div id="mapPoints" class="leaflet-host"></div>
            <div class="map-stat" id="mapStatPoints"></div>
          </div>
        </section>
        <aside class="col right">
          <div class="panel grow">
            <div class="panel-hd"><span class="ico shop"></span><h3>异业核销雷达</h3></div>
            <div id="crossRadar" class="hot-stores"></div>
          </div>
          <div class="panel">
            <div class="panel-hd"><span class="ico bag"></span><h3>兑换热品</h3></div>
            <div id="goodsPoints" class="rank-list"></div>
          </div>
        </aside>
      </div>
    </section>

    <footer class="screen-foot">
      <span>键 1 / 2 / 3 切页 · 约 50 秒轮播 · 地图可拖动标注</span>
      <span id="updatedAt">—</span>
    </footer>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="./screen.js"></script>
</body>
</html>
