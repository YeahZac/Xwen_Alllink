<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>万业互联云 · 运营台</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="app">
    <section id="loginView" class="login-screen">
      <div class="login-card">
        <p class="brand">万业互联云</p>
        <h1>运营管理台</h1>
        <p class="muted">邀请码登录 · 默认 <code>A001</code></p>
        <label>邀请码</label>
        <input id="loginCode" value="A001" autocomplete="off" />
        <button id="btnLogin" class="btn primary">进入运营台</button>
        <p id="loginErr" class="err"></p>
        <p class="muted tip"><a href="/api/health" target="_blank">API 健康检查</a></p>
      </div>
    </section>

    <section id="dashView" class="shell hidden">
      <aside class="sidebar">
        <div class="side-brand">
          <strong>万业互联云</strong>
          <span>运营台</span>
        </div>
        <nav id="nav" class="nav"></nav>
        <div class="side-foot">
          <span id="who" class="muted"></span>
          <button id="btnLogout" class="btn ghost sm">退出</button>
        </div>
      </aside>

      <div class="workspace">
        <header class="topbar">
          <h2 id="pageTitle">概览</h2>
          <span id="cashRate" class="pill"></span>
        </header>
        <main id="content" class="content"></main>
      </div>
    </section>
  </div>

  <div id="modal" class="modal hidden">
    <div class="modal-card">
      <header>
        <h3 id="modalTitle">编辑</h3>
        <button type="button" id="modalClose" class="btn ghost sm">关闭</button>
      </header>
      <div id="modalBody"></div>
      <footer id="modalFoot"></footer>
    </div>
  </div>

  <script src="./app.js"></script>
</body>
</html>
